{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <nav>
      <section class="TopNav"><a href="Recipes">Recipies</a></section>
      <section class="TopNav"><a href="AboutMe">AboutMe</a></section>
    </nav>
    <section id="Main">
      <div id="search">
  <form method="GET" action="{% url 'Recipes' %}">
    <input type="text" name="search" placeholder="Szukaj przepisów..."
           value="{{ request.GET.search }}" />
    <input type="submit" value="search" />
  </form>
</div>

      {% for recipe in recipes %}
        <div class="recipe">
          <h2>{{ recipe.title }}</h2>
          <img src="{{ recipe.img.url }}" alt="{{ recipe.title }}">
          <a class="short_link" href="/Blog/Recipes/{{recipe.id}}">{{ recipe.text|truncatechars:100 }}</a>
        </div>
      {% empty %}
        <p>No recipes found.</p>
      {% endfor %}
    </section>
    </section>
    <footer>&copy; 2025 All rights reserved</footer>
  </body>
</html>
